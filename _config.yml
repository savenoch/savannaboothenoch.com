# --- Site settings ---
title: Savanna Booth Enoch
tagline: Personal site & resume
description: >-
  Personal website and resume of Savanna Booth Enoch — product and program
  manager specializing in trust & safety, civic technology, and platform integrity.
author: Savanna Booth Enoch

# Published as a GitHub Pages *project* site at:
#   https://savenoch.github.io/savannaboothenoch.com/
# so the whole site lives under the /savannaboothenoch.com/ subpath and
# `baseurl` must reflect that (the `relative_url` filter prepends it to all
# asset/links). If you later set up the custom domain savannaboothenoch.com,
# set `baseurl: ""`, `url: "https://savannaboothenoch.com"`, and add a CNAME
# file containing that domain.
url: "https://savenoch.github.io"
baseurl: "/savannaboothenoch.com"

# --- Build settings ---
# Using a fully custom layout (no gem theme), so nothing to require here.
markdown: kramdown
permalink: pretty

# Files Jekyll should not copy into the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore

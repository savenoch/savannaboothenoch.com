# --- Site settings ---
title: Savanna Booth Enoch
tagline: Personal site & resume
description: >-
  Personal website and resume of Savanna Booth Enoch — product and program
  manager specializing in trust & safety, civic technology, and platform integrity.
author: Savanna Booth Enoch

# Served from the custom domain savannaboothenoch.com (see the CNAME file),
# so the site lives at the domain root. `baseurl` is empty and the
# `relative_url` filter prepends nothing, keeping asset/links at the root.
# (If you ever revert to the GitHub Pages project site at
# https://savenoch.github.io/savannaboothenoch.com/, set
# `baseurl: "/savannaboothenoch.com"` and `url: "https://savenoch.github.io"`.)
url: "https://savannaboothenoch.com"
baseurl: ""

# --- Build settings ---
# Using a fully custom layout (no gem theme), so nothing to require here.
markdown: kramdown
permalink: pretty

# Files Jekyll should not copy into the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
